services:
  category-service-db:
    image: postgres:16.1
    container_name: category-service-db
    ports:
      - "6550:5432"
    environment:
      - POSTGRES_DB=category-service
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=sa
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  compilation-service-db:
    image: postgres:16.1
    container_name: compilation-service-db
    ports:
      - "6551:5432"
    environment:
      - POSTGRES_DB=compilation-service
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=sa
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  event-service-db:
