server:
  port: 0

spring:
  application:
    name: event-service
  dataSource:
    driverClassName: org.postgresql.Driver
    password: sa
    url: jdbc:postgresql://localhost:6552/event-service
    username: sa
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      failureRateThreshold: 50

grpc:
  client:
    collector:
      address: 'discovery:///collector'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
    analyzer:
      address: 'discovery:///analyzer'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

hibernate:
  jdbc:
    time_zone: UTC
  show_sql: true
