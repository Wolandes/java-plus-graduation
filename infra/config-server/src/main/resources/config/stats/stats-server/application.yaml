server:
  port: 0

spring:
  application:
    name: stats-server
  dataSource:
    driverClassName: org.postgresql.Driver
    password: sa
    url: jdbc:postgresql://localhost:6554/stats-server
    username: sa
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

hibernate:
  jdbc:
    time_zone: UTC
  show_sql: true