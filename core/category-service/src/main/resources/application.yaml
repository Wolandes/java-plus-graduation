spring:
  application:
    name: category-service
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: category-service
      fail-fast: true
      retry:
        max-interval: 45000
        useRandomPolicy: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/